
name: Build, Test and Deploy ASP.Net Core app to Azure Web App - apicalidad

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore API dependencies
        run: dotnet restore ./APINet/APINet.csproj

      - name: Build API
        run: dotnet build ./APINet/APINet.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ./APINet/APINet.csproj --configuration Release --no-build --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  test:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore test dependencies
        run: dotnet restore ./Test/Tests.csproj

      - name: Run tests with coverage
        run: dotnet test ./Test/Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=test_results.trx"

      - name: Generate coverage report
        if: success()
        run: reportgenerator "-reports:./TestResults/**/coverage.cobertura.xml" "-targetdir:./TestResults/CoverageReport" "-reporttypes:Html"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport
          if-no-files-found: ignore

  deploy:
    runs-on: windows-latest

    needs: [build, test]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_093E9AEE2DC042FE8A1BBD71B1666150 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE608BA619A14632896C937ECBB56EEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5B9BCD9A51344B5D970AA385FCA7A5BD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apicalidad'
          slot-name: 'Production'
          package: ./publish
