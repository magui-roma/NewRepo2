# Docs for the Azure Web Apps Deploy action: https://github.com
# More GitHub Actions for Azure: https://github.com

name: Build, Test and Deploy ASP.Net Core app to Azure Web App - api-calidad

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # Requerido para actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Paso 1: Restaurar las dependencias/paquetes NuGet del proyecto
      - name: Restore dependencies
        run: dotnet restore

      # Paso 2: Compilar el proyecto en modo Release
      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

      # =========================================================================
      # 🚀 INYECCIÓN DE CALIDAD: EJECUCIÓN DE PRUEBAS UNITARIAS (Lo que faltaba)
      # =========================================================================
      - name: Execute Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Paso 3: Publicar los binarios de la API listos para el servidor IIS
      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write # Requerido para solicitar el JWT
      contents: read # Requerido para actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_093E9AEE2DC042FE8A1BBD71B1666150 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE608BA619A14632896C937ECBB56EEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5B9BCD9A51344B5D970AA385FCA7A5BD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apicalidad'
          slot-name: 'Production'
          package: .net-app
